<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>후쿠오카 3박 4일</title>
  <style>
    /* 3단계(디자인)에서 작성 */
  </style>
</head>
<body>
  <header>
    <h1>후쿠오카 3박 4일</h1>
    <p>12월 · 성인 4명</p>
  </header>

  <main>
    <section id="schedule">
      <h2>일정</h2>

      <article class="day" data-day="1">
        <h3>1일차</h3>
        <ol>
          <li>오후 도착</li>
          <li>캐널시티</li>
          <li>나카스 포장마차 (저녁)</li>
        </ol>
      </article>

      <article class="day" data-day="2">
        <h3>2일차</h3>
        <ol>
          <li>다자이후 텐만구</li>
          <li>스타벅스 다자이후점</li>
          <li>모츠나베 (저녁)</li>
        </ol>
      </article>

      <article class="day" data-day="3">
        <h3>3일차</h3>
        <ol>
          <li>유후인 당일치기 (버스 왕복)</li>
          <li>긴린코 호수</li>
        </ol>
      </article>

      <article class="day" data-day="4">
        <h3>4일차</h3>
        <ol>
          <li>하카타역 쇼핑</li>
          <li>오후 출국</li>
        </ol>
      </article>
    </section>

    <section id="budget">
      <h2>1인 예산</h2>
      <table>
        <thead>
          <tr><th>항목</th><th>금액</th></tr>
        </thead>
        <tbody>
          <tr><td>항공</td><td data-amount="250000">250,000원</td></tr>
          <tr><td>숙소 (3박)</td><td data-amount="180000">180,000원</td></tr>
          <tr><td>식비</td><td data-amount="150000">150,000원</td></tr>
          <tr><td>교통</td><td data-amount="80000">80,000원</td></tr>
        </tbody>
        <tfoot>
          <tr><th>합계</th><td id="budget-total">-</td></tr>
        </tfoot>
      </table>
    </section>

    <section id="checklist">
      <h2>준비물</h2>
      <ul>
        <li><label><input type="checkbox" data-item="passport"> 여권</label></li>
        <li><label><input type="checkbox" data-item="usim"> 유심</label></li>
        <li><label><input type="checkbox" data-item="yen"> 엔화 (1인 3만 엔)</label></li>
        <li><label><input type="checkbox" data-item="umbrella"> 우산</label></li>
      </ul>
    </section>
  </main>

  <script>
    // 2단계(기능)에서 작성: 예산 합계 계산, 체크리스트 저장
  </script>
</body>
</html>
